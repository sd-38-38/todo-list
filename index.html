<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Progress Tracking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="leaf leaf-1" aria-hidden="true"></div>
  <div class="leaf leaf-2" aria-hidden="true"></div>
  <div class="leaf leaf-3" aria-hidden="true"></div>

  <main class="container">
    <h1>Personalized Progress Tracking</h1>

    <form class="add-form" id="add-form">
      <input type="text" id="todo-input" placeholder="Yeni madde yazın..." autocomplete="off">
      <button type="submit">Ekle</button>
    </form>

    <div class="list-actions">
      <button type="button" class="clear-all-btn" id="clear-all">Tümünü Sil</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
